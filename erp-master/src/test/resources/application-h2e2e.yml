spring:
  datasource:
    url: "jdbc:h2:mem:erp_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  session:
    store-type: none

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    cache-enabled: false
    call-setters-on-nulls: true
    mapUnderscoreToCamelCase: true
